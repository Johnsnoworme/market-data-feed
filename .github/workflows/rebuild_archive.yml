name: Rebuild Archive (one-off 2026-10-07)
on:
  push:
    paths: ['rebuild_archive.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas lxml requests
      - run: python rebuild_archive.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --staged --quiet || (git commit -m "Rebuild weekly/monthly archive (Finviz universe)" && git pull --rebase && git push)
