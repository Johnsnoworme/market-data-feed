name: Top3 Pullback Follow

on:
  schedule:
    # 2026-10-05 변경: Yahoo 종가가 마감 후 약 5~6시간 뒤에 들어오므로 그 뒤로 (그날 종가가 없으면 저장하지 않음 · ny_session.py)
    # UTC 화~토 02:40 / 04:10 = 뉴욕 월~금 밤
    - cron: '40 2 * * 2-6'
    - cron: '10 4 * * 2-6'
  # 2026-10-02 추가: Market Data가 끝나면 바로 이어서 실행 (새 Daily Top 3를 반드시 반영)
  workflow_run:
    workflows: ["Update Market Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas
      - run: python top3_follow.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add top3
          git diff --staged --quiet || (git commit -m "Top3 pullback follow" && git pull --rebase && git push)
