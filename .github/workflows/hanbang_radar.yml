name: Hanbang Radar (한 방 레이더)

on:
  schedule:
    # 뉴욕 월~금 장 마감 후 (시드니 아침 Claude 매일 심사 전에 준비)
    - cron: '55 21 * * 1-5'
    - cron: '25 22 * * 1-5'
  push:
    paths:
      - 'hanbang_radar.py'
      - '.github/workflows/hanbang_radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas numpy requests lxml
      - run: python hanbang_radar.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hanbang
          git diff --staged --quiet || (git commit -m "Hanbang radar" && git pull --rebase && git push)
