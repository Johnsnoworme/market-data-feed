name: Hanbang Radar (한 방 레이더)

on:
  schedule:
    # 2026-10-05 변경: Yahoo 종가는 뉴욕 마감 후 약 5~6시간 뒤에 들어옴 → 예전 시간(21:55/22:25)은 늘 하루 늦은 데이터였음
    # UTC 화~토 02:40 / 04:10 / 06:40 = 뉴욕 월~금 밤 · 그날 종가가 없으면 저장하지 않고 다음 실행 때 다시 시도 (ny_session.py)
    # Claude '🎯 한 방 매일 심사'는 시드니 저녁에 이 결과를 읽음
    - cron: '40 2 * * 2-6'
    - cron: '10 4 * * 2-6'
    - cron: '40 6 * * 2-6'
  push:
    paths:
      - 'hanbang_radar.py'
      - '.github/workflows/hanbang_radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas numpy requests lxml
      - run: python hanbang_radar.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hanbang
          git diff --staged --quiet || (git commit -m "Hanbang radar" && git pull --rebase && git push)
