name: Bottom Leaders v2 Backtest (manual)

on:
  workflow_dispatch:
  push:
    paths:
      - 'bottom_v2.py'
      - '.github/workflows/bt_bottom_v2.yml'

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas numpy requests
      - run: python bottom_v2.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add research/bottom_leaders
          git diff --staged --quiet || (git commit -m "Bottom leaders v2 backtest" && git pull --rebase && git push)
