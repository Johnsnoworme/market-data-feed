name: Social Arbitrage Daily

on:
  schedule:
    # 뉴욕 월~금 장 마감 후 = 시드니 다음 날 아침 (풀백 추적보다 먼저)
    - cron: '50 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas requests lxml
      - run: python social_arb.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add social
          git diff --staged --quiet || (git commit -m "Social arbitrage daily" && git pull --rebase && git push)
