name: Index Candles (🕯️ 지수 캔들 피드)

on:
  schedule:
    # 뉴욕 마감 후 Yahoo가 종가를 채우는 시간대 (ohlc_feed와 동일). 이미 게시한 거래일이면 건너뜀.
    - cron: '10 3 * * 2-6'
    - cron: '40 4 * * 2-6'
    - cron: '10 7 * * 2-6'
  push:
    paths:
      - 'index_candles.py'
      - '.github/workflows/index_candles.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 게시한 거래일이어도 다시 만들기 (1 = 예)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas numpy requests lxml
      - name: Already published? (검증 통과로 게시된 거래일이면 건너뜀)
        run: |
          curl -s -m 20 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/index-data/index/_summary.json" -o prev.json || true
          P=$(python3 -c "import json;d=json.load(open('prev.json'));print(d['ny_date'] if d.get('verdict')=='OK' else '')" 2>/dev/null || true)
          echo "PUBLISHED_NY=$P" >> $GITHUB_ENV
      - run: python index_candles.py
        env:
          DATA_FORCE: ${{ (github.event_name == 'push' || github.event.inputs.force == '1') && '1' || '0' }}
      # 결과는 main이 아니라 'index-data' 브랜치에 단일 커밋으로 덮어쓴다
      - name: Publish to index-data branch
        if: hashFiles('out/index/_summary.json') != '' || hashFiles('out/index/_error.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b index-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Index candles $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index-data
