name: Social Radar Backtest (manual)

on:
  workflow_dispatch:
    inputs:
      enrich:
        description: '저장된 신호에 실적·위키만 다시 붙이기 (1 = 예)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas requests lxml scipy
      - run: python bt_social.py
        env:
          ENRICH: ${{ github.event.inputs.enrich || '0' }}
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add research
          git diff --staged --quiet || (git commit -m "Social radar backtest" && git pull --rebase && git push)
