name: Small Bottleneck Radar (소형 병목 레이더)

on:
  schedule:
    # 매주 토요일 (뉴욕 금요일 장 마감 후)
    - cron: '30 23 * * 5'
    # 2026-10-05 추가: Yahoo 종가 지연 대비 토요일 재시도 (그날 종가가 없으면 저장하지 않음)
    - cron: '40 2 * * 6'
    - cron: '10 4 * * 6'
  push:
    paths:
      - 'small_radar.py'
      - '.github/workflows/small_radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  small:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yfinance pandas numpy requests lxml
      - run: python small_radar.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hanbang
          git diff --staged --quiet || (git commit -m "Small bottleneck radar" && git pull --rebase && git push)
