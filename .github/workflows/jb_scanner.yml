name: JB Weekly Scanner

on:
  schedule:
    # 금요일 UTC 21:25 / 21:50 = 시드니 토요일 07:25~08:50 (서머타임 여부에 따라)
    # 뉴욕 금요일 장 마감(UTC 20:00 여름 / 21:00 겨울) 이후, 시드니 오전 9시 전에 끝나도록 설정
    # 두 번째 실행은 첫 실행이 데이터 부족으로 건너뛴 경우를 위한 재시도 (이미 파일이 있으면 아무것도 안 함)
    - cron: '25 21 * * 5'
    - cron: '50 21 * * 5'
  workflow_dispatch: # 수동 버튼 실행 허용

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 워치리스트(최근 60일 Top 3 기록)를 읽기 위해 전체 기록 필요

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml requests

      - name: Run JB scanner
        run: python jb_scanner.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner
          git diff --staged --quiet || (git commit -m "JB weekly scanner" && git pull --rebase && git push)
