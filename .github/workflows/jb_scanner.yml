name: JB Weekly Scanner

on:
  schedule:
    # 2026-10-05 변경: 21:18 / 21:48 → 22:03 / 22:33 (John 승인 · 넉넉한 여유)
    # 뉴욕 금요일 장 마감(UTC 20:00 여름 / 21:00 겨울) 후 최소 1시간 3분 (겨울) · 2시간 3분 (여름)
    # 시드니 토요일 08:03~09:33 (서머타임 여부에 따라) + GitHub 자체 지연
    # 두 번째 실행은 첫 실행이 데이터 부족으로 건너뛴 경우를 위한 재시도 (이미 파일이 있으면 아무것도 안 함)
    - cron: '03 22 * * 5'
    - cron: '33 22 * * 5'
    # 2026-10-05 추가: 토요일 안전망 (Yahoo 종가는 마감 후 약 5~6시간 뒤에야 들어옴 → 위 두 번은 건너뛸 수 있음)
    # UTC 토 02:40 / 04:10 / 13:00 = 뉴욕 금요일 밤 ~ 토요일 아침 · 이미 파일이 있으면 아무것도 안 함
    - cron: '40 2 * * 6'
    - cron: '10 4 * * 6'
    - cron: '0 13 * * 6'
  workflow_dispatch: # 수동 버튼 실행 허용
    inputs:
      overwrite:
        description: '같은 주 결과를 새로 덮어쓰기 (1 = 예)'
        required: false
        default: '0'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 워치리스트(최근 60일 Top 3 기록)를 읽기 위해 전체 기록 필요

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml requests

      - name: Run JB scanner
        env:
          JB_OVERWRITE: ${{ github.event.inputs.overwrite || '0' }}
        run: python jb_scanner.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner
          git diff --staged --quiet || (git commit -m "JB weekly scanner" && git pull --rebase && git push)
