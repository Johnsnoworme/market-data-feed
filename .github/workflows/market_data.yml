name: Update Market Data

on:
  schedule:
    # 2026-10-07 변경: 시간은 전부 UTC로 고정 (시드니·뉴욕 서머타임과 상관없이 매일 같은 시각)
    # 뉴욕 장 마감 = UTC 20:00(미국 서머타임) / 21:00(겨울) → 21:30 UTC는 어느 계절이든 마감 후
    # 숫자는 '마지막으로 끝난 뉴욕 거래일 종가' 기준이라, 실행이 늦어져도(GitHub 지연) 같은 숫자
    # 백업 2번(23:30, 01:30 UTC)은 GitHub가 실행을 놓칠 때만 의미 있음 — 이미 저장됐으면 안 바꿈
    # 2026-10-14 변경: GitHub 예약이 3~5시간씩 늦거나 건너뛰는 일이 잦아(10/14 시드니 10시까지 미실행) 시도 3번 → 7번.
    # 붐비는 정각·30분은 피함. 모두 UTC 21:20(겨울 뉴욕 16:20) 이후라 계절 상관없이 장중 데이터 저장 없음.
    # 이미 저장된 날은 절대 다시 안 씀(save_daily_snapshot) → 여러 번 돌아도 숫자는 그대로.
    # 그래도 안 돌면: 시드니 11:52 🩺 시스템 점검(Claude)이 확인하고 수동 실행 → 노트 채움.
    - cron: '23 21 * * *'
    - cron: '47 21 * * *'
    - cron: '13 22 * * *'
    - cron: '41 22 * * *'
    - cron: '17 23 * * *'
    - cron: '43 23 * * *'
    - cron: '37 1 * * *'
  workflow_dispatch: # 수동 버튼 실행 허용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml requests

      - name: Run Market Data Script
        run: python cloud_market_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Market_Data.md archive
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Market_Data.md" && git pull --rebase && git push)
