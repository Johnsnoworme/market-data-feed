name: Update Market Data

on:
  schedule:
    - cron: '15 20 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests pandas yfinance lxml

      - name: Run data collector
        run: python cloud_market_data.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Market_Data.md
          git commit -m "Update market data $(date -u +%Y-%m-%d)" || echo "변경사항 없음"
          git push
