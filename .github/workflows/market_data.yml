name: Update Market Data

on:
  schedule:
    # 시드니 시간 오전 8:00 (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 버튼 실행 허용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance

      - name: Run Market Data Script
        run: python cloud_market_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Market_Data.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Market_Data.md" && git push)
