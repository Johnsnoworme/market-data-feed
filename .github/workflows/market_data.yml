name: Update Market Data

on:
  schedule:
    # UTC 21:15 = 시드니 오전 7:15 (AEST) / 8:15 (AEDT 서머타임)
    # 미국 장 마감 이후 + 시드니 오전 9시 단축어 실행 전에 항상 끝나도록 설정
    - cron: '15 21 * * *'
  workflow_dispatch: # 수동 버튼 실행 허용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml requests

      - name: Run Market Data Script
        run: python cloud_market_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Market_Data.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Market_Data.md" && git push)
