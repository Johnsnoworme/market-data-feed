name: Update Market Data

on:
  schedule:
    # UTC 22:00 = 시드니 시간 오전 08:00 AM
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run script
        run: python cloud_market_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Market_Data.md history.csv
          git commit -m "Update market data & history" || echo "No changes to commit"
          git push
